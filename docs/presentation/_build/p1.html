<meta charset="utf-8">
<title>Pit-Stop Racer Pro</title>
<meta name="description" content="Embedded Systems, Cyber-Physical Systems and Robotics, TUM. Autonomous racing that manages its own energy, tires and fuel on an NVIDIA JetRacer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/*__CSS__*/
</style>
<style>
  /* ============================================================
     H1 ADDITIONS (HUD, clock rail, act cards, new slide layouts)
     ============================================================ */

  /* ---- persistent HUD (top right of the stage) ---- */
  .hud{position:absolute;top:24px;right:30px;z-index:30;width:268px;padding:11px 16px 13px;
    border:1px solid rgba(52,225,214,.30);background:rgba(6,10,14,.78);backdrop-filter:blur(8px);
    opacity:0;transform:translateY(-8px);transition:opacity .32s ease,transform .32s ease,border-color .4s ease}
  .hud.on{opacity:1;transform:none}
  .hud .hl{font-family:var(--mono);font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:rgba(52,225,214,.62);
    transition:opacity .16s ease}
  .hud .hv{font-family:var(--display);font-weight:700;font-size:31px;line-height:1.1;color:var(--cyan);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .hud .hv.out{opacity:0;transform:scale(.86);filter:blur(3px);transition:opacity .16s ease,transform .16s ease,filter .16s ease}
  .hud .hv.in{opacity:0;transform:scale(1.12);filter:blur(3px)}
  .hud .hv.settle{opacity:1;transform:none;filter:blur(0);
    transition:opacity .22s cubic-bezier(.2,.9,.25,1),transform .22s cubic-bezier(.2,.9,.25,1),filter .22s}
  .hud--wet{border-color:rgba(255,176,32,.42)}
  .hud--wet .hl{color:rgba(255,176,32,.66)}
  .hud--wet .hv{color:var(--amber)}
  .hud.alarm{animation:hudAlarm .28s 2}
  @keyframes hudAlarm{0%,100%{border-color:rgba(52,225,214,.30)}50%{border-color:var(--amber);box-shadow:0 0 22px rgba(255,176,32,.35)}}

  /* ---- clock rail (sits just above the footer) ---- */
  .rail{position:absolute;left:0;right:0;bottom:50px;height:52px;z-index:24;display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line);background:linear-gradient(to top,rgba(11,14,15,.96),rgba(11,14,15,.55));
    transform:translateY(60px);opacity:0;transition:transform .42s cubic-bezier(.16,.84,.28,1),opacity .3s ease}
  .rail.on{transform:none;opacity:1}
  .rseg{padding:8px 22px;border-left:1px solid var(--line);display:grid;grid-template-columns:1fr auto;
    grid-template-rows:auto auto;gap:5px 12px;align-content:center;opacity:.25;transition:opacity .35s ease}
  .rseg:first-child{border-left:0}
  .rseg.hot{opacity:1}
  .rseg .rk{font-family:var(--mono);font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:var(--fg-dim)}
  .rseg .rv{font-family:var(--display);font-weight:700;font-size:15px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
  .rseg .rv em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--fg-dim);letter-spacing:.14em;margin-left:5px}
  .rseg .rbar{grid-column:1/-1;height:4px;background:var(--ink3);position:relative;overflow:hidden}
  .rseg .rbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--cyan);transition:width .26s linear}
  .rseg[data-k="tire"] .rbar i{background:var(--green)}
  .rseg[data-k="fuel"] .rbar i{background:var(--amber)}
  .rseg.low .rv{color:var(--red)}
  .rseg.pulse{animation:rsegPulse .3s 3}
  @keyframes rsegPulse{0%,100%{background:transparent}50%{background:rgba(255,59,71,.16)}}
  .stage.rail-on .slide:not(.actcard):not(#svid):not(.nopad){padding-bottom:150px}

  /* ---- act cards ---- */
  .slide.actcard{padding:0;align-items:center;justify-content:center;text-align:center;background:#05080A}
  .actcard .anum{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:var(--display);font-weight:700;
    font-size:330px;line-height:1;color:var(--cyan);opacity:.13;letter-spacing:-.04em;user-select:none}
  .actcard .awrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:13px}
  .actcard .aeyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--fg-dim)}
  .actcard .atitle{font-family:var(--display);font-weight:700;font-size:74px;line-height:1;letter-spacing:.02em;color:var(--fg)}
  .actcard .athesis{font-family:var(--display);font-weight:500;font-size:22px;color:var(--cyan);max-width:36ch;line-height:1.3}
  .actcard .aspk{margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim)}
  .actcard .aspk b{color:var(--fg-mid);font-weight:500}

  /* ---- generic helpers ---- */
  .badge-sim{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,176,32,.4);padding:5px 9px;border-radius:2px;white-space:nowrap}
  .badge-sim::before{content:"";width:6px;height:6px;background:var(--amber)}
  .badge-real{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--green);border:1px solid rgba(53,208,122,.4);padding:5px 9px;border-radius:2px;white-space:nowrap}
  .badge-real::before{content:"";width:6px;height:6px;background:var(--green)}
  .headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-right:290px}
  .plain{font-size:17px;line-height:1.55;color:var(--fg-mid);max-width:60ch}
  .blt{list-style:none;display:flex;flex-direction:column;gap:6px;margin:6px 0 0}
  .blt li{position:relative;padding-left:16px}
  .blt li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--fg-dim)}
  .blt.cy li::before{background:var(--cyan)}
  .blt.am li::before{background:var(--amber)}
  .blt.gr li::before{background:var(--green)}
  .plain b{color:var(--fg);font-weight:600}
  .formula{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;color:var(--fg-dim);
    border-left:2px solid var(--line-strong);padding:6px 0 6px 13px}
  .formula b{color:var(--cyan);font-weight:500}

  /* ---- 02 premise ---- */
  #p02{justify-content:center;align-items:center;text-align:center}
  #p02 .p1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.16;max-width:24ch;text-wrap:balance;position:relative;z-index:3}
  #p02 .p1 u{text-decoration:none;position:relative;color:var(--amber)}
  #p02 .p1 u::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:3px;background:var(--amber);transition:right .5s ease .25s}
  #p02 .p1.shown u::after{right:0}
  #p02 .p2{margin-top:24px;font-size:17.5px;line-height:1.6;color:var(--fg-mid);max-width:54ch;position:relative;z-index:3}
  #p02 .infs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:150px;
    font-size:210px;color:var(--cyan);opacity:0;transition:opacity .8s ease;pointer-events:none;font-family:var(--display);z-index:1}
  #p02 .infs.shown{opacity:.06}

  /* ---- 04 three clocks ---- */
  .clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:22px;align-content:start}
  .clock{border:1px solid var(--line-strong);background:linear-gradient(180deg,rgba(22,27,29,.9),rgba(15,19,20,.94));
    padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:11px;position:relative;overflow:hidden}
  .clock .ck{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-dim)}
  .clock .cring{width:122px;height:122px;position:relative}
  .clock .cring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .clock .cring .bgring{fill:none;stroke:var(--ink3);stroke-width:9}
  .clock .cring .fgring{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
  .clock .cnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .clock .cnum b{font-family:var(--display);font-weight:700;font-size:29px;line-height:1;font-variant-numeric:tabular-nums}
  .clock .cnum span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--fg-dim);text-transform:uppercase}
  .clock .cdesc{font-size:13px;line-height:1.5;color:var(--fg-mid);text-align:center}
  .clock .cdesc b{color:var(--fg);font-weight:600}
  .clock.batt .fgring{stroke:var(--cyan)}   .clock.batt .cnum b{color:var(--cyan)}
  .clock.tire .fgring{stroke:var(--green)}  .clock.tire .cnum b{color:var(--green)}
  .clock.fuel .fgring{stroke:var(--amber)}  .clock.fuel .cnum b{color:var(--amber)}

  /* ---- 05 anatomy (vector JetRacer + callouts) ---- */
  .jr svg{width:100%;height:100%;display:block;overflow:visible}
  .jr .ln{fill:none;stroke:var(--cyan);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  .jr .ln.thin{stroke-width:1.6;stroke-opacity:.62}
  .jr .fillbody{fill:#121819}
  .jr .fillpanel{fill:#182022}
  .jr .am{stroke:var(--amber)}
  .jr .gr{stroke:var(--green)}
  .jr .rd{stroke:var(--red)}
  .jr .tyre{fill:#14191A;stroke:#2C3639;stroke-width:3}
  .jr .rim{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-opacity:.9}
  .jr text{font-family:"IBM Plex Mono",monospace;fill:var(--fg-dim)}
  .jr .ln,.jr .rim{stroke-dasharray:var(--d,1400);stroke-dashoffset:var(--d,1400)}
  .jr.drawn .ln,.jr.drawn .rim{animation:drawIn 1.5s var(--ez) forwards}
  @keyframes drawIn{to{stroke-dashoffset:0}}
  .jr .fillbody,.jr .fillpanel,.jr .tyre,.jr .shadow{opacity:0;transition:opacity .7s ease .55s}
  .jr.drawn .fillbody,.jr.drawn .fillpanel,.jr.drawn .tyre,.jr.drawn .shadow{opacity:1}
  .jr .lens{fill:#0B0E0F;stroke:var(--amber);stroke-width:2.4}
  .jr .fov{opacity:0;transition:opacity .6s ease 1.1s}
  .jr.drawn .fov{opacity:1}
  .jr .part{transition:opacity .45s var(--ez),filter .45s var(--ez)}
  .jr.focusing .part{opacity:.2}
  .jr .part.hot{opacity:1;filter:drop-shadow(0 0 10px rgba(52,225,214,.75))}
  .jr .call{opacity:0;transform:translateY(6px);transition:opacity .45s var(--ez),transform .45s var(--ez)}
  .jr .call.on{opacity:1;transform:none}
  .jr .leader{stroke:var(--cyan);stroke-width:1.4;fill:none;stroke-opacity:.75}
  .jr .cbox{fill:rgba(15,19,20,.94);stroke:var(--cyan);stroke-width:1.3}
  .jr .ct{font-size:14px;font-weight:600;fill:#E9EBEA;font-family:"Chakra Petch",sans-serif}
  .jr .cs{font-size:10px;fill:#828C8D;letter-spacing:.02em}
  .jr .cn{font-size:10px;fill:#34E1D6;letter-spacing:.18em}
  .jr .dot{fill:var(--cyan)}
  #p05 .jr.anat{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:1180px;height:560px;z-index:8}

  /* ---- 06 perception ---- */
  .perc{display:grid;grid-template-columns:.55fr 1.45fr;gap:26px;flex:1;align-items:start;min-height:0;margin-top:6px}
  .frame{border:1px solid var(--cyan);background:var(--ink0);aspect-ratio:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .frame .fl{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--cyan);z-index:2}
  .frame .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    animation:fscan 2.6s linear infinite;z-index:2}
  @keyframes fscan{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
  .heads{display:flex;flex-direction:column;gap:12px}
  .head3{border:1px solid var(--line-strong);background:rgba(22,27,29,.88);padding:13px 17px}
  .head3>b{font-family:var(--display);font-weight:600;font-size:18px;color:var(--fg);display:block;margin-bottom:4px}
  .head3>span{font-size:13.5px;line-height:1.45;color:var(--fg-mid);display:block}
  .head3>ul.blt{font-size:13.5px;line-height:1.45;color:var(--fg-mid)}
  .head3 .tag{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:6px;display:block;letter-spacing:.04em}
  .head3.gr{border-left:2px solid var(--green)} .head3.am{border-left:2px solid var(--amber)} .head3.cy{border-left:2px solid var(--cyan)}
  .swatches{display:inline-flex;gap:6px;vertical-align:middle;margin-left:8px}
  .swatches i{width:14px;height:14px;display:inline-block;border:1px solid rgba(255,255,255,.25)}

  /* ---- 08 smart battery ---- */
  .sb{display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;min-height:0;margin-top:12px;align-items:center}
  .window{display:flex;flex-direction:column;gap:8px}
  .wlap{display:grid;grid-template-columns:74px 1fr 54px;align-items:center;gap:12px}
  .wlap .wk{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--fg-dim);text-transform:uppercase}
  .wlap .wb{height:15px;background:var(--ink3);position:relative;overflow:hidden}
  .wlap .wb i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);opacity:.75;width:0;transition:width .55s cubic-bezier(.2,.7,.2,1) .12s}
  .wlap.shown .wb i{width:var(--w,80%)}
  .wlap .wv{font-family:var(--display);font-weight:700;font-size:15px;text-align:right;color:var(--fg)}
  .mathbox{border:1px solid var(--line-strong);background:rgba(11,14,15,.7);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .mrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0;padding-bottom:0}
  .mrow .mk{font-size:14px;color:var(--fg-mid);line-height:1.4}
  .mrow .mv{font-family:var(--display);font-weight:700;font-size:25px;color:var(--cyan);white-space:nowrap;font-variant-numeric:tabular-nums}
  .mrow.big .mv{font-size:33px}
  .mrow .mv.am{color:var(--amber)}

  /* ---- 09 verdict ---- */
  #p09 .calc{display:grid;grid-template-columns:1fr auto;gap:0 30px;max-width:760px;margin-top:20px}
  #p09 .crow{display:contents}
  #p09 .ck2{font-size:16px;color:var(--fg-mid);padding:13px 0;border-bottom:1px solid var(--line);line-height:1.3}
  #p09 .cv2{font-family:var(--display);font-weight:700;font-size:26px;text-align:right;padding:13px 0;
    border-bottom:1px solid var(--line);color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
  #p09 .cv2.cy{color:var(--cyan)} #p09 .cv2.am{color:var(--amber)}
  #p09 .compare{margin-top:26px;display:flex;align-items:center;gap:22px}
  #p09 .compare .cmp{font-family:var(--display);font-weight:700;font-size:40px;color:var(--fg);font-variant-numeric:tabular-nums}
  #p09 .compare .op{font-family:var(--display);font-weight:700;font-size:40px;color:var(--fg-dim);transition:transform .3s ease,color .3s ease}
  #p09 .compare.hot .op{transform:scale(1.9);color:var(--amber)}
  #p09 .stamp{margin-left:16px;font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:.1em;color:var(--red);
    border:3px solid var(--red);padding:6px 22px;opacity:0;transform:scale(1.5) rotate(-3deg)}
  #p09 .stamp.on{opacity:1;transform:scale(1) rotate(-3deg);transition:opacity .18s ease,transform .22s cubic-bezier(.2,1.5,.4,1)}
  #p09 .after{margin-top:26px}
