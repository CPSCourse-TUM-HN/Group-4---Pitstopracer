listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence false
# Not `all`: that includes debug, which logs every PUBLISH. At 20 Hz across
# seven topics that is ~40 lines a second -- megabytes over a demo, and it
# buries the connect/disconnect lines you actually need when diagnosing.
log_type error
log_type warning
log_type notice
log_type information
