services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pitstop-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    # Without a cap Docker's json log grows unbounded. With log_type all this
    # container produced ~1.8 million PUBLISH lines in a single afternoon; even
    # at the reduced log level a long-running demo should not be able to fill
    # the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
